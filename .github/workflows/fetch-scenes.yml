name: Fetch painted scenes
# Downloads the painted scene images listed in scenes/sources.json, converts them to
# responsive WebP/AVIF in public/scenes, and commits them to the branch it ran on.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save sharp@0.34
      - run: node scenes/fetch.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scenes
          git diff --cached --quiet || git commit -m "Add painted scenes (fetched by workflow)"
          git push
